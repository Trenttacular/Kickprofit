name: KickProfit
options:
  bundleIdPrefix: com.trenttacular
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  swift: "5.9"
  defaultConfig: Debug
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug:   debug
  Release: release

settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    ENABLE_PREVIEWS: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0

targets:
  KickProfit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KickProfit
        excludes:
          - "**/*.md"
          - "**/*.html"
    resources:
      - path: KickProfit/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: KickProfit
        PRODUCT_BUNDLE_IDENTIFIER: com.trenttacular.KickProfit
        INFOPLIST_FILE: KickProfit/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
      Release:
        SWIFT_OPTIMIZATION_LEVEL: "-O"
